name: Build iOS IPA unsigned

# Unsigned iOS build. No signing secrets required.
# Output cannot be installed on device or uploaded to App Store as-is.

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'build-name (empty = pubspec)'
        required: false
        type: string
      build_number:
        description: 'build-number (empty = run_number)'
        required: false
        type: string
  push:
    branches:
      - camaera1.0.1
    paths:
      - '.github/workflows/build-ios-ipa.yml'
      - 'camerax/ios/**'
      - 'pubspec.lock'

jobs:
  build-ipa-unsigned:
    name: Flutter iOS unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -i Xcode || true
          # Prefer Xcode 16.x which matches camera_avfoundation Swift APIs.
          for app in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode.app
          do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          gem install cocoapods
          cd ios
          pod install --repo-update

      - name: Disable code signing for CI
        run: |
          set -euo pipefail
          # Flutter 3.44 在打真机包时仍会检查 Development Team；CI 无证书时强制关闭签名。
          for cfg in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig; do
            {
              echo ''
              echo '// CI unsigned build'
              echo 'CODE_SIGNING_ALLOWED=NO'
              echo 'CODE_SIGNING_REQUIRED=NO'
              echo 'CODE_SIGN_IDENTITY=-'
              echo 'EXPANDED_CODE_SIGN_IDENTITY=-'
              echo 'DEVELOPMENT_TEAM=-'
            } >> "$cfg"
          done

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${{ inputs.build_name }}" ]; then
            EXTRA_ARGS+=(--build-name="${{ inputs.build_name }}")
          fi
          if [ -n "${{ inputs.build_number }}" ]; then
            EXTRA_ARGS+=(--build-number="${{ inputs.build_number }}")
          else
            EXTRA_ARGS+=(--build-number="${{ github.run_number }}")
          fi

          flutter build ios --release --no-codesign "${EXTRA_ARGS[@]}" -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            EXPANDED_CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=-

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "Runner.app not found at ${APP_PATH}"
            find build/ios -maxdepth 3 -type d -name "*.app" || true
            exit 1
          fi

          OUT_DIR="build/ios/ipa"
          mkdir -p "${OUT_DIR}/Payload"
          rm -rf "${OUT_DIR}/Payload/"*
          cp -R "${APP_PATH}" "${OUT_DIR}/Payload/Runner.app"

          IPA_NAME="watermark_camera-unsigned-${{ github.run_number }}.ipa"
          (
            cd "${OUT_DIR}"
            zip -r -y "${IPA_NAME}" Payload
          )
          ls -lh "${OUT_DIR}/${IPA_NAME}"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: watermark-camera-ipa-unsigned
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
